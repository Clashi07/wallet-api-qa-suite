name: Wallet API QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: API tests
        run: pytest -m api -v
      - name: Database validation tests
        run: pytest -m db -v
      - name: Integration tests with coverage
        run: pytest -m integration --cov=wallet --cov-report=term-missing --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: report.xml
